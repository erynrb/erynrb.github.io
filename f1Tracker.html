<script>
    var requestOptions = {
    method: 'GET',
    redirect: 'follow'
    };

fetch("https://corsproxy.io/?https://api.jolpi.ca/ergast/f1/2025/driverstandings/")
  .then(response => response.text())
  .then(result => {
    console.log(result);
    const parsedRes = JSON.parse(result);
    const data = parsedRes.MRData.StandingsTable.StandingsLists[0].DriverStandings
    const points = []
    for (let i = 1; i<22; i++){
        points.push(data[i-1].points)
    }
    console.log(data)
    const pointWidth = Math.max(...points) 
    windowWidth = window.innerWidth
    const maxWidth = Math.min(pointWidth*2+200+60+100, 0.8*windowWidth, 750)
    console.log(maxWidth)
    for (let i = 1; i < 22; i++){
        const code = document.getElementById("codeP" + String(i))
        const position = (String(data[i-1].points)/pointWidth)*(maxWidth-200-60-100)
        console.log(position)
        console.log(data[i-1].Driver.code)
        console.log(data[i-1].Constructors[0].constructorId)
        code.innerHTML = data[i-1].Driver.givenName + " " + data[i-1].Driver.familyName
        document.getElementById("carP" + String(i)).src = "carGraphics/" + data[i-1].Constructors[0].constructorId + ".png" /*change to car*/
        document.getElementById("carP" + String(i)).style = "width:100px; margin-left:"+position+"px;"
        document.getElementById("P" + String(i)).style = "width:" + String(maxWidth) + "px;"
    }
})
  .catch(error => console.log('error', error));
  function showHide(){
      var x = document.getElementById("showy");
      var y = document.getElementById("showyButton");
        if (x.style.display === "none") {
            x.style.display = "block";
            y.innerHTML="show less";
        } else {
            x.style.display = "none";
            y.innerHTML="show more";

        }
  }
</script>
